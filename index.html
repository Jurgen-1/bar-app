<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Jurgen's Bar App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  </head>
  <body>

    <template id="confirm-screen-template">
      <div class="confirmation-screen">
        <div class="confirmation-panel">
          <div class="confirm-image">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="-78.46 -39.442 18.923 13.356"><path fill="white" d="m-59.546-38.314.009-.13-.009-.13-.026-.128-.042-.124-.058-.117-.073-.109-.087-.098-.098-.086-.11-.072-.118-.058-.124-.042-.129-.026-.131-.008-.131.008-.129.026-.125.042-.118.058-.109.072-.044.038-.009-.009L-71.5-28.914l-5.22-5.22-.024-.027-.023-.02-.026-.026-.002.002-.048-.042-.109-.072-.118-.058-.125-.042-.129-.025-.131-.009-.131.009-.129.025-.124.042-.118.058-.11.072-.098.086-.087.098-.073.109-.058.117-.043.124-.025.128-.009.13.009.13.025.128.043.124.058.117.073.108.047.053-.002.002.034.034.008.009.008.007 6.657 6.657 11.561-11.561.009-.006.098-.086.087-.098.073-.108.058-.117.042-.124z"/></svg>
          </div>
          <div class="confirmation-message">
            <h1>
              Order sent!
            </h1>
            <div>
              Your order was sent to the bar staff.
            </div>
          </div>

          <div class="confirmation-info">
            <div class="confirmation-info-row">Table <span>7</span></div>
            <div class="confirmation-info-row">Total <span class="confirmation-total-price">ALL 100500</span></div>
          </div>
        </div>

        <button class="button new-order-button">
          Start new order
        </button>

      </div>
    </template>

    <template id="order-item-template">
      <div class="menu-item">
        <div class="menu-item-image-container">
          <img class="menu-item-image" src="/rizoto.jpg" alt="">
        </div>
        <div class="menu-item-info">
          <div class="menu-item-name">dfghdfgh</div>
          <div class="menu-item-price order-item-price">ALL 123</div>
          <div class="order-amount-controls">
            <button class="menu-item-button order-decrement">-</button>
            <div class="order-item-amount">
              1
            </div>
            <button class="menu-item-button order-increment">+</button>
          </div>
        </div>
        <button class="menu-item-button order-item-delete">
          <img src="/trash.svg" alt="">
        </button>
      </div>
    </template>

    <div id="app"></div>

    <!-- ==========================
    Templates
    ========================== -->

    <!-- --- Order screen --- -->

    <template id="order-header-template">
      <header id="header" class="order-header">
        <button class="header-back-button">
          <img src="/chevron-left.svg" alt="">
        </button>
        <div class="order-header-text">
          <h1>Your Order</h1>
          <h2 class="order-table">
            Table <span id="table-num">7</span>
          </h2>
        </div>
      </header>
    </template>

    <template id="order-screen-panel">
      <div class="order-screen-button-panel">
        <button class="order-now-button button center">
          Order now
        </button>
        <button class="back-button button-secondary center">
          Back to Menu
        </button>
      </div>
    </template>

    <template id="order-panel-template">
      <div class="order-panel">
        <button class="order-button button">
          <div class="items-amount">
            Items
          </div>
          <div>
            Order ->
          </div>
          <div class="items-price">
            ALL 2000
          </div>
        </button>
      </div>
    </template>

    <!-- --- Menu screen --- -->

    <template id="menu-item-template">
      <div class="menu-item">
        <div class="menu-item-image-container">
          <img class="menu-item-image" src="/rizoto.jpg" alt="">
        </div>
        <div class="menu-item-info">
          <div class="menu-item-name"></div>
          <div class="menu-item-description"></div>
          <div class="menu-item-price"></div>
        </div>
        <div class="menu-item-button-container">
          <button class="menu-item-button">+</button>
        </div>
      </div>
    </template>

    <template id="menu-header-template">
      <header id="header" class="header">
        <div>
          <h1>Bar Menu</h1>
          <h2>
            Order food & drinks
          </h2>
        </div>
        <div>
          <div class="table">
            Table <span id="table-num">7</span>
          </div>
        </div>
      </header>
    </template>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
